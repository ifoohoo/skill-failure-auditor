name: deploy-llm-academy-pages
# 仅从公开包内 docs/llm-academy 部署 GitHub Pages；权限最小化；不引入站点框架。
# 当前状态：待激活（公开仓创建并批准，W13 外部批准点后启用）。
on:
  push:
    branches: [main]
    paths:
      - "docs/llm-academy/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/llm-academy
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
